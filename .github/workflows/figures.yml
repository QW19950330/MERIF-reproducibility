name: Rebuild publication figures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  figures:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild main-text figures
        run: python scripts/build_submission_figures.py
      - name: Verify outputs
        run: python scripts/verify_outputs.py
